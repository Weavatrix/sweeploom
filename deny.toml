# Dependency policy for SweepLoom.
#
# SweepLoom itself is MPL-2.0. Weavatrix crates remain MIT and are consumed
# as unmodified third-party dependencies. Do not copy Weavatrix sources here.

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "tokio", reason = "SweepLoom MVP is std::thread + channels, not an async runtime" },
    { name = "hyper", reason = "no network client stack in the base product" },
    { name = "reqwest", reason = "local-first: no cloud HTTP client in the base product" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    # clipboard-win / error-code (egui-winit → arboard)
    "BSL-1.0",
    # epaint_default_fonts bundled faces
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is a transitive egui/ab_glyph dep; no safe upgrade until eframe moves off it" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive netstat2/netlink dep used for Windows listeners; no safe upgrade" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Weavatrix/weavatrix-git",
    "https://github.com/Weavatrix/weavatrix-scan",
]
