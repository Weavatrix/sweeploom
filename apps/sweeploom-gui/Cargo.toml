[package]
name = "sweeploom-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.95"
publish.workspace = true
description = "SweepLoom desktop UI (egui + eframe, glow renderer)"

[lints]
workspace = true

[[bin]]
name = "sweeploom-gui"
path = "src/main.rs"

[features]
default = []
# Sandboxed Mac App Store edition: folder grants, no subprocesses.
# Packaged by scripts/macos-mas.py; off for the open-source build.
mas = ["dep:sweeploom-macos", "dep:weavatrix-git"]

[dependencies]
sweeploom-core = { workspace = true }
sweeploom-platform = { workspace = true }
sweeploom-process = { workspace = true }
sweeploom-session = { workspace = true }
sweeploom-storage = { workspace = true }
sweeploom-network = { workspace = true }
sweeploom-dev = { workspace = true }
sweeploom-exec = { workspace = true }
sweeploom-general = { workspace = true }
sweeploom-history = { workspace = true }
sweeploom-ai = { workspace = true }
sweeploom-browser = { workspace = true }
sweeploom-macos = { workspace = true, optional = true }
weavatrix-git = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { version = "0.25.6", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }
