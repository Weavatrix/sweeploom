[workspace]
resolver = "3"
members = [
    "crates/sweeploom-core",
    "crates/sweeploom-platform",
    "crates/sweeploom-process",
    "crates/sweeploom-session",
    "crates/sweeploom-network",
    "crates/sweeploom-storage",
    "crates/sweeploom-rules",
    "crates/sweeploom-exec",
    "crates/sweeploom-dev",
    "crates/sweeploom-ai",
    "crates/sweeploom-general",
    "crates/sweeploom-browser",
    "crates/sweeploom-history",
    "crates/sweeploom-cli",
    "apps/sweeploom-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
repository = "https://github.com/Weavatrix/sweeploom"
homepage = "https://github.com/Weavatrix/sweeploom"
rust-version = "1.88"
publish = false

[workspace.dependencies]
sweeploom-core = { path = "crates/sweeploom-core", version = "0.1.0" }
sweeploom-platform = { path = "crates/sweeploom-platform", version = "0.1.0" }
sweeploom-process = { path = "crates/sweeploom-process", version = "0.1.0" }
sweeploom-session = { path = "crates/sweeploom-session", version = "0.1.0" }
sweeploom-network = { path = "crates/sweeploom-network", version = "0.1.0" }
sweeploom-storage = { path = "crates/sweeploom-storage", version = "0.1.0" }
sweeploom-rules = { path = "crates/sweeploom-rules", version = "0.1.0" }
sweeploom-exec = { path = "crates/sweeploom-exec", version = "0.1.0" }
sweeploom-dev = { path = "crates/sweeploom-dev", version = "0.1.0" }
sweeploom-ai = { path = "crates/sweeploom-ai", version = "0.1.0" }
sweeploom-general = { path = "crates/sweeploom-general", version = "0.1.0" }
sweeploom-browser = { path = "crates/sweeploom-browser", version = "0.1.0" }
sweeploom-history = { path = "crates/sweeploom-history", version = "0.1.0" }

weavatrix-scan = { version = "0.5.3", default-features = false }
weavatrix-git = { version = "0.3.4", default-features = false }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
sysinfo = "0.38.4"
crossbeam-channel = "0.5.15"
toml = "1.1.8"
etcetera = "0.11.0"

eframe = { version = "0.33.3", default-features = false, features = ["glow", "persistence", "accesskit", "x11", "wayland"] }
egui = "0.33.3"
egui_extras = { version = "0.33.3", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind so the GUI's worker `catch_unwind` contains a failed scan instead of
# aborting the whole app.
panic = "unwind"
strip = "symbols"
