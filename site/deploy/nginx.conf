# SweepLoom marketing site: static Next.js export, published by scripts/deploy.sh.
# Installed as /etc/nginx/sites-available/sweeploom.com; certbot adds the TLS
# server block and the HTTP -> HTTPS redirect on `deploy.sh --tls`.
server {
    listen 80;
    listen [::]:80;
    server_name sweeploom.com www.sweeploom.com;
    root /var/www/sweeploom.com;
    index index.html;
    absolute_redirect off;
    # The privacy page promises no visitor logs.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    error_page 404 /404.html;
}

# Hosts that are not ours get the connection closed instead of a default page.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
