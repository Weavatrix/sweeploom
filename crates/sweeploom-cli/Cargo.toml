[package]
name = "sweeploom"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true
description = "SweepLoom by Weavatrix: CLI, MCP for agents, and a Rust library"
readme = "../../README.md"
default-run = "sweeploom"
keywords = ["mcp", "cleanup", "disk", "sessions", "ai"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[lib]
name = "sweeploom"
path = "src/lib.rs"

[[bin]]
name = "sweeploom"
path = "src/main.rs"

[[bin]]
name = "sweeploom-companion-host"
path = "src/bin/companion_host.rs"

[features]
default = ["mcp"]
mcp = ["dep:mcport"]

[dependencies]
sweeploom-core = { workspace = true }
sweeploom-platform = { workspace = true }
sweeploom-process = { workspace = true }
sweeploom-session = { workspace = true }
sweeploom-storage = { workspace = true }
sweeploom-network = { workspace = true }
sweeploom-dev = { workspace = true }
sweeploom-exec = { workspace = true }
sweeploom-general = { workspace = true }
sweeploom-browser = { workspace = true }
sweeploom-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mcport = { version = "0.6.1", optional = true }
